<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopFamily - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="login.style.css">
</head>
<body>

    <div class="app-wrapper">
        <main class="login-container">
            <div class="logo-area">
                <div class="logo-icon"></div>
                <h1 class="logo-text">ShopFamily</h1>
            </div>

            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <input type="email" id="login-email" placeholder="E-mail" required>
                </div>
                
                <div class="input-group password-wrapper">
                    <input type="password" id="login-senha" placeholder="Senha" required>
                    <button type="button" class="toggle-password" onclick="togglePasswordVisibility('login-senha', this)">
                        <i class="far fa-eye"></i>
                    </button>
                </div>

                <div class="form-links">
                    <a href="esqueci.html" class="link-action">Esqueci a senha</a>
                    <a href="cadastro.html" class="link-action highlighting">Cadastre-se</a>
                </div>

                <button type="submit" class="btn-primary">Entrar</button>
            </form>

            <div class="social-divider">
                <span>Entrar com:</span>
            </div>

           <div class="social-login">
                <a href="#" class="social-icon google" onclick="loginSocial('google')">
                    <i class="fab fa-google"></i>
                </a>
                <a href="#" class="social-icon facebook" onclick="loginSocial('facebook')">
                    <i class="fab fa-facebook-f"></i>
                </a>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="login.script.js"></script>
</body>
</html>
