<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopFamily - Suas Listas</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="dark-theme">

    <div class="app-container">
        
        <header class="search-header">
            <div class="search-bar-container">
                <i class="fas fa-search search-icon"></i>
                <input type="text" placeholder="Search" id="search-input">
            </div>
            <button class="cart-btn">
                <i class="fas fa-shopping-cart"></i>
            </button>
        </header>

        <main class="main-content">
            <section class="content-section" style="height: 100%; display: flex; flex-direction: column;">
                <h2 class="page-title">Suas Listas</h2>
                
                <div class="listas-wrapper" id="listas-container">
                    </div>
            </section>
        </main>

        <nav class="bottom-nav-container">
            <div class="bottom-nav">
                <a href="index.html" class="nav-item">
                    <i class="fas fa-home"></i>
                </a>
                <a href="mais_compras.html" class="nav-item">
                    <i class="fas fa-store"></i>
                </a>
                <a href="favoritos.html" class="nav-item">
                    <i class="fas fa-heart"></i>
                </a>
                <a href="listas.html" class="nav-item active">
                    <i class="fas fa-list-ul"></i>
                </a>
                <a href="perfil.html" class="nav-item">
                    <i class="fas fa-user"></i>
                </a>
            </div>
        </nav>

    </div>

    <div class="custom-modal-overlay" id="custom-modal">
        <div class="custom-modal-card">
            <h3 class="modal-title" id="modal-title">Criar Nova Lista</h3>
            <p class="modal-subtitle" id="modal-subtitle">Digite o nome da sua lista abaixo:</p>
            
            <!-- Input para quando for criar lista -->
            <input type="text" id="modal-input" class="modal-input-field" placeholder="Ex: Compras do Mês">
            
            <div class="modal-actions">
                <button class="modal-btn btn-cancel" id="modal-cancel-btn">Cancelar</button>
                <button class="modal-btn btn-confirm" id="modal-confirm-btn">Confirmar</button>
            </div>
        </div>
    </div>

    <!-- Scripts do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="listas.script.js"></script>
</body>
</html>
