<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopFamily - Esqueci a Senha</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.style.css">
</head>
<body>

    <div class="app-wrapper">
        <main class="login-container">
            <div class="logo-area">
                <div class="logo-icon"></div>
                <h1 class="logo-text">ShopFamily</h1>
            </div>

            <form id="esqueciSenhaForm" class="login-form">
                <div class="input-group">
                    <input type="email" id="recuperar-email" placeholder="E-mail" required>
                </div>

                <div class="input-group">
                    <input type="email" id="recuperar-confirmar-email" placeholder="Confirmar E-mail" required>
                </div>

                <button type="submit" class="btn-primary">Enviar e-mail</button>
                
                <div class="back-to-login">
                    <a href="login.html" class="link-action">Voltar para o Login</a>
                </div>
            </form>
        </main>
    </div>

    <script src="login.script.js"></script>
</body>
</html>
